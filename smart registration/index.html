<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>





    <div class="container">
        <form id="registrationForm">

            <h2>Registration Form</h2>
            <p class="subtitle">Create your account</p>

            <!-- Name -->
            <div class="form-group">
                <label for="name">Name <span class="star">*</span></label>
                <input type="text" id="name" placeholder="Enter your name">
                <small id="nameError" class="error"></small>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email <span class="star">*</span></label>
                <input type="email" id="email" placeholder="Enter your email">
                <small id="emailError" class="error"></small>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password <span class="star">*</span></label>
                <input type="password" id="password" placeholder="Enter your password">
                <small id="passwordError" class="error"></small>
            </div>

            <!-- Bio -->
            <div class="form-group">
                <label for="bio">Bio <span class="star">*</span></label>

                <textarea id="bio" rows="5" maxlength="200" placeholder="Write something about yourself..."></textarea>

                <div class="counter">
                    <span id="bioError" class="error"></span>
                    <span id="charCount">0 / 200 characters</span>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" id="submitBtn" disabled>
                Register
            </button>

            <p id="successMessage" class="success"></p>

        </form>
    </div>


    <script src="script.js"></script>
</body>

</html>
